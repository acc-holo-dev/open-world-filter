# Источники данных open-world-filter.
# kind: domains | ips | exclusions
# tier: auto (жёсткие доказательства) | community (правки сообщества) | heuristic (эвристика -> только флаг)
# Удалённые источники пропускаются при --offline;
# локальные файлы резолвятся относительно корня проекта.

[[source]]
name = "antifilter-domains"
kind = "domains"
tier = "auto"
enabled = true
url = "https://antifilter.download/list/domains.lst"
evidence = "Реестр РКН (зеркало antifilter.download)"

[[source]]
name = "antifilter-ips"
kind = "ips"
tier = "auto"
enabled = true
url = "https://antifilter.download/list/ip.lst"
evidence = "Реестр РКН (зеркало antifilter.download)"

